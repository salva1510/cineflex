<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>My Library • CineFlex</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/modules/cineflex-premium308.css?v=308.0"><script src="js/modules/cineflex-premium308.js?v=308.0" defer></script></head><body class="cf307-library"><header><button class="cf307-back" onclick="history.length>1?history.back():location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Back</button><img src="cineflex-header-logo.png" alt="CineFlex" style="height:42px;max-width:160px;object-fit:contain"><button class="cf307-back" onclick="location.href='index.html'"><i class="fa-solid fa-house"></i></button></header><main><p style="color:#e50914;font-weight:900;letter-spacing:.15em">YOUR PERSONAL SPACE</p><h1>My Library</h1><p style="color:#aaa;max-width:700px">Continue watching, saved titles and recent activity in one fast, TV-friendly page.</p><div class="cf307-tabs"><button class="cf307-tab active" data-tab="cineflex_continue">Continue Watching</button><button class="cf307-tab" data-tab="cineflex_watchlist">My List</button><button class="cf307-tab" data-tab="cineflex_recent">Recently Watched</button></div><div id="grid" class="cf307-grid"></div></main><script>
const IMG='https://image.tmdb.org/t/p/w500'; let active='cineflex_continue';
function get(k){try{let x=JSON.parse(localStorage.getItem(k)||'[]');if(!Array.isArray(x)&&x)x=Object.values(x);return Array.isArray(x)?x:[]}catch{return[]}}
function norm(x){return{id:x.id||x.tmdbId||x.movieId,title:x.title||x.name||x.original_title||x.original_name||'Untitled',poster:x.poster_path||x.poster||x.image||'',type:x.media_type||x.type||'movie',year:(x.release_date||x.first_air_date||x.year||'').toString().slice(0,4),progress:Number(x.progress||x.percent||0)}}
function render(){let a=get(active).map(norm).filter(x=>x.id);let g=document.getElementById('grid');g.innerHTML=a.length?a.map((x,i)=>`<article class="cf307-card" tabindex="0" data-i="${i}"><button class="cf307-remove" aria-label="Remove" data-r="${i}"><i class="fa-solid fa-xmark"></i></button><img loading="lazy" src="${x.poster?(x.poster.startsWith('http')?x.poster:IMG+x.poster):'icon-512.png'}" alt="${x.title.replaceAll('"','&quot;')}"><div class="info"><h3>${x.title}</h3><p>${x.year||x.type}${x.progress?' • '+Math.round(x.progress)+'%':''}</p>${x.progress?`<div class="cf307-progress"><i style="width:${Math.min(100,x.progress)}%"></i></div>`:''}</div></article>`).join(''):'<div class="cf307-empty"><i class="fa-solid fa-film" style="font-size:3rem"></i><h2>Nothing here yet</h2><p>Browse CineFlex and save or watch a title.</p></div>';[...g.querySelectorAll('.cf307-card')].forEach((el,i)=>{el.onclick=e=>{if(e.target.closest('[data-r]'))return;let x=a[i];location.href=`details.html?id=${encodeURIComponent(x.id)}&type=${encodeURIComponent(x.type)}`};el.onkeydown=e=>{if(e.key==='Enter')el.click()}});[...g.querySelectorAll('[data-r]')].forEach((b,i)=>b.onclick=e=>{e.stopPropagation();let raw=get(active);raw.splice(i,1);localStorage.setItem(active,JSON.stringify(raw));render()})}
document.querySelectorAll('.cf307-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cf307-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.tab;render()});render();</script></body></html>

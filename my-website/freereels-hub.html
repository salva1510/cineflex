<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeReels — CineFlex</title>
<link rel="stylesheet" href="freereels-hub.css">
</head>
<body>
<header class="topbar">
  <button class="back" onclick="history.back()">‹</button>
  <div>
    <div class="brand">FREE<span>REELS</span></div>
    <div class="sub">Vertical Mini Dramas</div>
  </div>
  <button class="search" id="searchBtn">⌕</button>
</header>

<main id="app">
  <section class="hero">
    <div class="hero-copy">
      <div class="eyebrow">CINEFLEX ORIGINAL SECTION</div>
      <h1>Short stories.<br><span>Big drama.</span></h1>
      <p>Swipe through vertical mini-dramas, one episode at a time.</p>
      <button class="primary" id="browseBtn">▶ Browse FreeReels</button>
    </div>
  </section>
  <div id="rows"></div>
</main>

<div class="search-modal" id="searchModal" hidden>
  <div class="search-box">
    <button id="closeSearch">×</button>
    <input id="searchInput" placeholder="Search FreeReels..." autocomplete="off">
    <div id="searchResults"></div>
  </div>
</div>

<script src="freereels-hub.js"></script>
</body>
</html>

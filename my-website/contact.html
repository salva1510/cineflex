<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>Contact CineFlex | CineFlex</title><link rel="stylesheet" href="css/modules/cineflex-ultimate306.css?v=306.1"><link rel="stylesheet" href="css/modules/legal-community3061.css?v=306.1"><script src="js/modules/cineflex-ultimate306.js?v=306.1" defer></script></head><body class="cf-policy-page"><main class="cf-policy-shell"><div class="cf-policy-top"><button class="cf-policy-back" onclick="history.length>1?history.back():location.href='index.html'">← Back</button><img src="cineflex-header-logo.png" alt="CineFlex" style="height:42px;max-width:180px;object-fit:contain"></div><article class="cf-policy-card"><h1>Contact CineFlex</h1><p><small>Last updated: 30 July 2026</small></p><form class="cf-support-form" id="cfContactForm"><label>Topic<select id="cfContactTopic"><option>General support</option><option>Movie request</option><option>Broken link or playback issue</option><option>Account issue</option><option>Copyright / DMCA</option></select></label><label>Your name<input id="cfContactName" maxlength="80" required></label><label>Email<input id="cfContactEmail" type="email" maxlength="120" required></label><label>Message<textarea id="cfContactMessage" maxlength="3000" required></textarea></label><div class="cf-support-actions"><button type="submit" class="cf-support-primary">Prepare Email</button><button type="button" class="cf-support-secondary" id="cfSaveRequest">Save on this device</button></div></form><script>document.getElementById('cfContactForm').addEventListener('submit',e=>{e.preventDefault();const t=document.getElementById('cfContactTopic').value,n=document.getElementById('cfContactName').value,m=document.getElementById('cfContactMessage').value,em=document.getElementById('cfContactEmail').value;location.href='mailto:support@cineflex.online?subject='+encodeURIComponent('[CineFlex] '+t)+'&body='+encodeURIComponent('Name: '+n+'\nEmail: '+em+'\n\n'+m)});document.getElementById('cfSaveRequest').onclick=()=>{const item={topic:cfContactTopic.value,name:cfContactName.value,email:cfContactEmail.value,message:cfContactMessage.value,date:new Date().toISOString()};const all=JSON.parse(localStorage.getItem('cineflex_support_requests')||'[]');all.unshift(item);localStorage.setItem('cineflex_support_requests',JSON.stringify(all.slice(0,50)));alert('Saved on this device.');};</script></article></main></body></html>
